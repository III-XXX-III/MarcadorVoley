<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover"
    >

    <meta name="theme-color" content="#080808">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >
    <meta
        name="apple-mobile-web-app-title"
        content="Voley"
    >

    <title>Marcador Voley</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="marcador">

        <!-- EQUIPO A -->

        <section class="equipo">

            <button
                class="nombre-equipo"
                id="nombreA"
                onclick="cambiarNombre('A')"
            >
                EQUIPO A
            </button>

            <button
                class="boton-color"
                onclick="cambiarColor('A')"
            >
                COLOR
                <span
                    class="muestra-color"
                    id="colorA"
                ></span>
            </button>

            <div
                class="puntos"
                id="puntosA"
            >
                0
            </div>

            <div class="botones-puntos">

                <button
                    class="boton-punto sumar"
                    onclick="sumar('A')"
                >
                    +
                </button>

                <button
                    class="boton-punto restar"
                    onclick="restar('A')"
                >
                    −
                </button>

            </div>

        </section>


        <!-- CENTRO -->

        <section class="centro">

            <div class="linea-centro"></div>

            <div class="marcador-sets">

                <div class="titulo-sets">
                    SETS
                </div>

                <div class="sets">

                    <div class="set-equipo">

                        <button
                            class="boton-set"
                            onclick="restarSet('A')"
                        >
                            −
                        </button>

                        <span
                            class="numero-set"
                            id="setsA"
                        >
                            0
                        </span>

                        <button
                            class="boton-set"
                            onclick="sumarSet('A')"
                        >
                            +
                        </button>

                    </div>


                    <span class="guion-set">
                        –
                    </span>


                    <div class="set-equipo">

                        <button
                            class="boton-set"
                            onclick="restarSet('B')"
                        >
                            −
                        </button>

                        <span
                            class="numero-set"
                            id="setsB"
                        >
                            0
                        </span>

                        <button
                            class="boton-set"
                            onclick="sumarSet('B')"
                        >
                            +
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- EQUIPO B -->

        <section class="equipo">

            <button
                class="nombre-equipo"
                id="nombreB"
                onclick="cambiarNombre('B')"
            >
                EQUIPO B
            </button>

            <button
                class="boton-color"
                onclick="cambiarColor('B')"
            >
                COLOR
                <span
                    class="muestra-color"
                    id="colorB"
                ></span>
            </button>

            <div
                class="puntos"
                id="puntosB"
            >
                0
            </div>

            <div class="botones-puntos">

                <button
                    class="boton-punto sumar"
                    onclick="sumar('B')"
                >
                    +
                </button>

                <button
                    class="boton-punto restar"
                    onclick="restar('B')"
                >
                    −
                </button>

            </div>

        </section>

    </main>


    <!-- CONTROLES -->

    <footer class="controles">

        <button
            class="boton-control"
            onclick="reiniciarPuntos()"
        >
            REINICIAR PUNTOS
        </button>

        <button
            class="boton-control"
            onclick="nuevoPartido()"
        >
            NUEVO PARTIDO
        </button>

    </footer>


    <!-- PALETA DE COLORES -->

    <div
        class="modal-color oculto"
        id="modalColor"
    >

        <div class="panel-color">

            <div class="titulo-color">
                COLOR DEL EQUIPO
            </div>

            <div
                class="paleta"
                id="paleta"
            ></div>

            <button
                class="cerrar-color"
                onclick="cerrarColores()"
            >
                CERRAR
            </button>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
